# Конфигурация MOEX-робота. Секреты — ТОЛЬКО имена переменных окружения.
# Значения, помеченные "# DEFAULT", взяты по умолчанию из ТЗ, т.к. не были
# заданы явно — при необходимости переопределите под конкретный счёт.

trading:
  mode: paper  # paper | live. live включается ТОЛЬКО явным изменением этого поля.

broker:
  kind: mock  # mock | tinvest | alor | finam | bcs.
  # kind: tinvest — реальный/sandbox брокер T-Invest (см. brokers/tinvest_adapter.py).
  #   Требует: pip install t-tech-investments --index-url
  #     https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
  #   (пакет переименован из tinkoff-investments, снятого с обычного PyPI — см. README раздел 4),
  #   TINVEST_TOKEN в /etc/tradingrobot.env (или окружении процесса),
  #   sandbox: true — это официальная песочница T-Invest
  #   (реальный контур брокера, изолированный от боевых денег), НЕ наш internal MockBroker.
  token_env: TINVEST_TOKEN        # имя переменной окружения с токеном, НЕ сам токен
  account_id_env: TINVEST_ACCOUNT_ID  # необязательно: если не задано, берётся первый счёт пользователя
  sandbox: true

instruments:  # DEFAULT: тикеры не были заданы -> пример на TQBR, замените под задачу
  - ticker: SBER
    board: TQBR      # DEFAULT секция: TQBR (акции). Для FORTS указывать board: FORTS + expiration
    instrument_class: share
    # lot_size/price_step ниже нужны ТОЛЬКО для broker.kind: mock (MockBroker не
    # знает реальных параметров бумаги). Для tinvest/alor/finam/bcs эти поля
    # игнорируются — спецификация приходит от API брокера.
    lot_size: 10            # DEFAULT — уточните реальный лот бумаги у брокера
    price_step: "0.01"      # DEFAULT — уточните реальный шаг цены у брокера
  - ticker: GAZP
    board: TQBR
    instrument_class: share
    lot_size: 10
    price_step: "0.01"
  # Пример фьючерса FORTS (раскомментируйте и подставьте актуальный тикер/дату
  # экспирации; class_code срочного рынка не всегда буквально "FORTS" — сверьте
  # у брокера):
  # - ticker: RIZ5
  #   board: FORTS
  #   instrument_class: future
  #   expiration: "2025-12-19"
  #   lot_size: 1
  #   price_step: "1"
  #   initial_margin_per_lot: "5000"   # DEFAULT-заглушка для mock — реальное ГО берите у брокера

features:
  short_window: 5          # баров для короткой волатильности/short_return
  mid_window: 20            # баров для mid_return/position_in_range/volume_vs_avg
  stale_threshold_ms: 5000  # данные старше этого возраста считаются оборванным каналом

regime:
  shock_volatility: "0.02"            # std лог-доходностей, выше -> shock
  low_liquidity_spread_bps: "50"      # спред в bps, выше -> low_liquidity
  low_liquidity_volume_ratio: "0.3"   # volume_vs_avg ниже -> low_liquidity
  trend_return_threshold: "0.01"      # |mid_return| выше -> uptrend/downtrend
  max_age_ms_for_classification: 5000

strategy:
  max_levels: 3                     # максимум уровней сетки на инструмент
  max_inventory_lots: 10            # максимум инвентаря (лотов) от сетки
  step_volatility_multiplier: "3"   # шаг сетки = f(volatility, price_step)
  min_step_price_steps: 2           # минимальный шаг сетки, в шагах цены
  level_notional_fraction: "0.1"    # доля разрешённого капитала на один уровень сетки

# Трендовая стратегия — работает ТОЛЬКО в uptrend/downtrend (сетка выше — только
# в range, они никогда не конкурируют за один такт). Пробойный вход + выход по
# фиксированному % от цены входа (stop_loss_pct/take_profit_pct), без усреднения.
strategy_trend:
  enabled: true
  entry_notional_fraction: "0.15"   # доля разрешённого капитала на вход
  aggressive_offset_bps: "15"       # насколько лимитка пересекает спред, чтобы исполниться сразу
  stop_loss_pct: "0.015"            # DEFAULT 1.5% от цены входа
  take_profit_pct: "0.03"           # DEFAULT 3% от цены входа
  min_volume_ratio: "1.3"           # momentum: объём должен быть не ниже 1.3x среднего, иначе вход пропускается

risk:
  max_daily_loss_pct: "0.01"      # DEFAULT 1%
  max_instrument_weight: "0.20"   # DEFAULT 20%
  cash_reserve: "10000"           # DEFAULT — неснижаемый остаток, в валюте счёта
  max_instruments: 3              # DEFAULT
  entry_start: "10:05:00"         # DEFAULT 10:05 MSK
  entry_cutoff_min: 15            # DEFAULT — запрет входов за N минут до закрытия сессии
  emergency_market_flatten: false # рыночные заявки допустимы ТОЛЬКО если true и только для аварийного закрытия

session:
  open_time: "10:00:00"   # основная сессия MOEX; сверить с актуальным календарём торгов MOEX
  close_time: "23:50:00"  # включает вечернюю доп. торговую сессию MOEX (после основной, до 23:50 МСК);
                           # сверить с актуальным календарём торгов MOEX и списком бумаг, у которых
                           # вечерняя сессия реально включена (не все тикеры в ней участвуют)

journal:
  jsonl_path: "./data/journal.jsonl"
  human_log_path: "./data/journal.log"

llm:
  enabled: false               # LLM-модуль ContextFilter отключён по умолчанию
  fail_closed: true            # при недоступности LLM -> trade_allowed=false (консервативно)
  api_key_env: LLM_API_KEY     # имя переменной окружения с ключом провайдера, НЕ сам ключ

state_store_path: "./data/state.json"
account_snapshot_path: "./data/account.json"  # читает веб-панель для показа P&L/позиций
tick_interval_seconds: 5.0

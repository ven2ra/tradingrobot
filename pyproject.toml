[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-robot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# T-Bank сняли пакет с обычного PyPI и переехали на свой GitLab-реестр —
# одного extras здесь недостаточно, нужен ещё --extra-index-url:
#   pip install -e '.[tinvest]' --extra-index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
tinvest = ["t-tech-investments"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
